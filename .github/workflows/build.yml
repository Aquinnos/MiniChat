name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available | head -30

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project MiniChat.xcodeproj \
            -scheme MiniChat \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project MiniChat.xcodeproj \
            -scheme MiniChat \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -only-testing:MiniChatTests \
            test 2>&1 | tail -60

      - name: SwiftLint (opcjonalnie)
        continue-on-error: true
        run: |
          if command -v swiftlint &> /dev/null; then
            swiftlint
          else
            echo "::warning::SwiftLint nie jest zainstalowany — pomijam"
          fi
